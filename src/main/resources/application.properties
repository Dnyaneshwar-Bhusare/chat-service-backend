server.port=9001
spring.application.name=service1

# Disable Eureka client temporarily to avoid connection issues during startup
eureka.client.enabled=false

# Database Configuration
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/db_chat
spring.datasource.username=root
spring.datasource.password=1997
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Health check settings
management.endpoint.health.show-details=always
management.health.status.http-mapping.down=503
management.health.status.http-mapping.up=200
management.health.status.http-mapping.out-of-service=503

# Jackson configuration for Java 8 date/time handling
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Blockchain / Ganache Configuration
blockchain.ganache.rpc-url=http://127.0.0.1:7545
blockchain.ganache.gas-price=20000000000
blockchain.ganache.gas-limit=6721975
